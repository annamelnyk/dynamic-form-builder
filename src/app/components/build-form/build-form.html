<section class="section">
  <div class="section__toolbar">
    @for(tool of formBuilderService.buildingTools; track tool.name) {
    <app-control-tool
      class="section__tool"
      [tool]="tool"
      (onToolClick)="addFormField($event)"
    />
    }
  </div>
  <div class="section__builder"></div>
</section>
