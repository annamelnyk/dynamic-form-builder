<mat-card
  class="control__card transition-colors"
  appearance="outlined"
  (click)="onToolClickHandler(tool())"
  cdkDrag
  [cdkDragData]="tool()"
>
  <mat-card-content>
    <div class="card__content__outer flex items-center">
      <div class="control__icon__outer">
        <mat-icon>{{ tool().icon }}</mat-icon>
      </div>
      <p class="control__name">{{ tool().type | titlecase }}</p>
    </div>
  </mat-card-content>
  <div *cdkDragPlaceholder></div>
</mat-card>
