<mat-card
  class="control__card"
  appearance="outlined"
  (click)="onToolClickHandler(tool())"
  cdkDrag
>
  <mat-card-content>
    <div class="card__content__outer flex items-center">
      <div class="control__icon__outer">
        <mat-icon>{{tool().icon}}</mat-icon>
      </div>
      <p class="control__name">{{tool().label | titlecase}}</p>
    </div>
  </mat-card-content>
</mat-card>
