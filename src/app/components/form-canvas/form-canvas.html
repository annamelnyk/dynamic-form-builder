<mat-card class="form__card" appearance="outlined">
  <mat-card-header class="form__card__header">
    <div contenteditable="true" class="form__header_field">Form Title</div>
    <div contenteditable="true" class="form__header_field">
      Form Description
    </div>
  </mat-card-header>
  <mat-card-content class="form__card__content">
    <ul
      cdkDropList
      [cdkDropListData]="formBuilderService.buildedFormFieldDefinitionsList()"
      (cdkDropListDropped)="onFieldTypeDropped($event)"
    >
      @if(!formBuilderService.generatedFormFiledsList().length) {
      <li class="subheader tracking-wide transition-all">
        Form fields will be displayed here
      </li>
      } @else { @for (formField of formBuilderService.generatedFormFiledsList();
      track formField.id; let index = $index; let first = $first; let last =
      $last) {
      <li cdkDrag [cdkDragDisabled]="true" class="form__card__item">
        <app-editable-form-field
          [formField]="formField"
          [isFirst]="first"
          [isLast]="last"
          (onMoveUp)="moveFieldPosition(index, index - 1)"
          (onMoveDown)="moveFieldPosition(index, index + 1)"
        />
        <ng-template cdkDragPlaceholder>
          <li class="drag__drop__placeholder form__card__item"></li>
        </ng-template>
      </li>
      } }
    </ul>
  </mat-card-content>
</mat-card>
