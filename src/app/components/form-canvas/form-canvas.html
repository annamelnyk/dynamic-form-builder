<mat-card class="form__card" appearance="outlined">
  <mat-card-header class="form__card__header">
    <div contenteditable="true" class="form__header_field">Form Title</div>
    <div contenteditable="true" class="form__header_field">
      Form Description
    </div>
  </mat-card-header>
  <mat-card-content class="p-0">
    <div
      cdkDropList
      (cdkDropListDropped)="onFieldTypeDropped($event)"
      class="form__card__content"
      [cdkDropListData]="formBuilderService.generatedFormFiledsList()"
    >
      @if(!formBuilderService.generatedFormFiledsList().length) {
      <p class="subheader tracking-wide transition-all">
        Form fields will be displayed here
      </p>
      } @for (formField of formBuilderService.generatedFormFiledsList(); track
      $index; let first = $first; let last = $last) {
      <app-editable-form-field
        [formField]="formField"
        [isFirst]="first"
        [isLast]="last"
      />
      }
    </div>
  </mat-card-content>
</mat-card>
