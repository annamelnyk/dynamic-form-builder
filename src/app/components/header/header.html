<header>
  <h1>Dynamic Form Builder</h1>
  <div class="controls">
    <button>Preview From</button>

    <mat-button-toggle-group [formControl]="theme" aria-label="App theme">
      @for (theme of themeService.getThemes(); track theme.name) {
      <mat-button-toggle [value]="theme.name">
        <mat-icon class="theme-icon">{{ theme.icon }}</mat-icon>
      </mat-button-toggle>
      }
    </mat-button-toggle-group>
  </div>
  
  <h2>{{theme.value}}</h2>
</header>
