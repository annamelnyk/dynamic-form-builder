<div class="field__outer transition-all">
  <div class="field__header">
    <div class="field__controls-aside">
      <button mat-icon-button>
        <mat-icon
          class="field__controls-arrow up"
          [class.disabled]="isFirst()"
          (click)="onClickMoveUp($event)"
          >arrow_upward_alt</mat-icon
        >
      </button>
      <button mat-icon-button>
        <mat-icon
          class="field__controls-arrow down"
          [class.disabled]="isLast()"
          (click)="onClickMoveDown($event)"
        >
          arrow_downward_alt
        </mat-icon>
      </button>
    </div>

    <div [formGroup]="controlsForm" class="field__controls-form">
      <input
        matInput
        class="w-full field__controls-input"
        type="text"
        [placeholder]="label"
        formControlName="label"
      />
      <div class="field__controls-end">
        <div class="field__controls-required">
          <mat-checkbox
            class="field__controls-label"
            id="required-{{ id }}"
            name="required-{{ id }}"
            formControlName="required"
            >Required</mat-checkbox
          >
        </div>
        <button mat-icon-button class="field__controls-remove ml-5">
          <mat-icon (click)="onRemoveField($event)">delete</mat-icon>
        </button>
      </div>
    </div>
  </div>
  <div class="field__body">
    <ng-container
      [ngComponentOutlet]="formField().component"
      [ngComponentOutletInputs]="{
        form: form(),
        formField: formField(),
        placeholder: placeholder(),
      }"
    ></ng-container>
  </div>
  <div class="field__footer"></div>
</div>
