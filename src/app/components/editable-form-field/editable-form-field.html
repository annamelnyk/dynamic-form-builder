<div class="field__outer transition-all">
  <div class="field__header">
    <div class="field__controls-aside">
      <div>
        <mat-icon
          class="field__controls-arrow up"
          [class.disabled]="isFirst()"
          (click)="onClickMoveUp($event)"
          >arrow_upward_alt</mat-icon
        >
      </div>
      <div>
        <mat-icon
          class="field__controls-arrow down"
          [class.disabled]="isLast()"
          (click)="onClickMoveDown($event)"
        >
          arrow_downward_alt
        </mat-icon>
      </div>
    </div>
    <label
      [for]="id"
      class="field__controls-label"
      contenteditable
      (input)="onTitleChange($event)"
      >{{formField().label | titlecase}}</label
    >
    <div class="field__controls-end">
      <div class="field__controls-required">
        <mat-checkbox
          class="field__controls-label"
          id="required-{{id}}"
          name="required-{{id}}"
          [checked]="formField().required"
          (change)="formBuilderService.toggleRequiredField(formField().id)"
          >Required</mat-checkbox
        >
      </div>
      <div class="field__controls-remove ml-5">
        <mat-icon
          (click)="this.formBuilderService.removeFormFieldDefinition(formField().id)"
          >delete_forever</mat-icon
        >
      </div>
    </div>
  </div>
  <div class="field__body">
    <ng-container
      [ngComponentOutlet]="formField().component"
      [ngComponentOutletInputs]="{formField: formField()}"
    ></ng-container>
  </div>
  <div class="field__footer"></div>
</div>
