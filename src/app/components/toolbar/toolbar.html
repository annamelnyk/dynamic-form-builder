<mat-card class="card__toolbar" appearance="outlined">
  <mat-card-header class="card__toolbar__header">
    <h2 class="card__toolbar__title">Add Form Elements</h2>
  </mat-card-header>
  <mat-card-content class="card___toolbar__content">
    <mat-grid-list cols="2" rowHeight="1:1">
      @for(tool of buildingTools(); track tool.name) {
      <mat-grid-tile>
        <app-control-tool
          class="control__tool"
          [tool]="tool"
          (onToolClick)="onSelectToolHandler($event)"
        />
      </mat-grid-tile>
      }
    </mat-grid-list>
  </mat-card-content>
</mat-card>
