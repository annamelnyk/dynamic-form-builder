<mat-form-field class="w-full field__input" [formGroup]="form()">
  @if (buildModeService.mode() === Mode.Preview) {
    <mat-label [attr.for]="formField().id">{{ formField().label }}</mat-label>
  }
  <textarea
    appAutofocus
    matInput
    [formControlName]="formField().id"
    [id]="formField().id"
    class="field__controls-input"
    type="text"
    [placeholder]="placeholder()"
    [required]="formField().required"
  ></textarea>
</mat-form-field>
