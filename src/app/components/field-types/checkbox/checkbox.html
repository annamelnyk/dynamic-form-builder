@if (buildModeService.mode() === Mode.Preview) {
  <mat-label [attr.for]="formField().id">{{ formField().label }}</mat-label>
  <div [formGroup]="form()">
    @for (value of formField().choices; track value.id) {
      <mat-checkbox class="field__input" [formControlName]="formField().id">{{
        value.choice
      }}</mat-checkbox>
      <br />
    }
  </div>
}

@if (buildModeService.mode() === Mode.Edit) {
  <div class="field__outer" [formGroup]="checkboxControlsForm()">
    @for (choice of formField().choices; let i = $index; track choice.id) {
      <div class="field__option-outer">
        <mat-checkbox formControlName="checked-{{ choice.id }}" />

        <mat-form-field class="w-full field__input">
          <input
            appAutofocus
            matInput
            class="w-full field__controls-input"
            type="text"
            placeholder="Option {{ i + 1 }}"
            formControlName="choice-{{ choice.id }}"
          />
        </mat-form-field>
        <app-button-icon
          [iconType]="Icon.Delete"
          (onButtonClick)="removeOptionHandler(choice.id)"
        />
      </div>
    }
    <app-plain-button
      title="Add option"
      position="end"
      (onButtonClick)="addCheckboxOption($event)"
    />
  </div>
}
