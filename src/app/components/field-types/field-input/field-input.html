<mat-form-field class="w-full" [formGroup]="form()">
  @if(formField().mode === Mode.Preview) {
  <mat-label [attr.for]="formField().id">{{ formField().label }}</mat-label>
  }
  <input
    matInput
    [id]="formField().id"
    class="field__controls-input"
    type="text"
    [placeholder]="placeholder() | titlecase"
    [required]="formField().required"
    [formControlName]="formField().id"
  />
</mat-form-field>
