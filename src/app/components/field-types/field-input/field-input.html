<mat-form-field class="w-full">
  @if(formField().mode === Mode.Preview) {
  <mat-label>{{formField().label}}</mat-label>
  }
  <input
    matInput
    [id]="formField().id"
    class="field__controls-input"
    type="text"
    [placeholder]="placeholder() | titlecase"
    [required]="formField().required"
  />
</mat-form-field>
