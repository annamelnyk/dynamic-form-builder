<div class="field__outer">
  <div class="field__header">
    <div class="field__controls-aside">
      <div class="mb-xs">
        <mat-icon class="field__controls-arrow up">arrow_upward_alt</mat-icon>
      </div>
      <div>
        <mat-icon class="field__controls-arrow down">
          arrow_downward_alt
        </mat-icon>
      </div>
    </div>
    <h3 class="field__controls-title" contenteditable>{{title()}}</h3>
    <div class="field__controls-end">
      <div class="field__controls-required">
        <input type="checkbox" id="required" name="required" />
        <label for="required" class="ml-xs">Required</label>
      </div>
      <div class="field__controls-remove">
        <mat-icon>delete_forever</mat-icon>
      </div>
    </div>
  </div>
  <div class="field__body">
    <input
      class="field__controls-input"
      type="text"
      [placeholder]="placeholder()"
    />
  </div>
  <div class="field__fooler"></div>
</div>
