<div class="flex flex-col px-4">
  <p class="subheader tracking-wide">
    Create responsive forms with Angular Material and TailwindCSS
  </p>
  <section class="flex gap-5 px-2 mb-10">
    <app-toolbar
      class="w-150"
      [buildingTools]="formBuilderService.buildingTools"
      (onSelectTool)="addFormField($event)"
    />

  </section>
</div>
