<section class="section">
  <div class="section__toolbar">
    <app-toolbar
      [buildingTools]="formBuilderService.buildingTools"
      (onSelectTool)="addFormField($event)"
    />
  </div>
  <div class="section__form">
    <mat-card class="form__card" appearance="outlined">
      <mat-card-header class="form__card__header">
        <!-- !!!!!!!!! -->
        <div contenteditable="true" class="form__header_field">Form Title</div>
        <div contenteditable="true" class="form__header_field">
          Form Description
        </div>
      </mat-card-header>
      <mat-card-content>
        <app-editable-form-field />
      </mat-card-content>
    </mat-card>
  </div>
</section>
