<section class="section">
  <div class="section__toolbar">
    <app-toolbar
      [buildingTools]="formBuilderService.buildingTools"
      (onSelectTool)="addFormField($event)"
    />
  </div>
  <div class="section__form">
    <mat-card class="form__card" appearance="outlined">
      <mat-card-header class="form__card__header">
        <!-- !!!!!!!!! -->
        <div contenteditable="true">I'm Editable. Edit me!</div>

        <mat-form-field class="form__field">
          <input matInput placeholder="Enter Form Title" value="" />
        </mat-form-field>

        <mat-form-field class="form__field">
          <input matInput placeholder="Enter Form Description" value="" />
        </mat-form-field>
      </mat-card-header>
      <mat-card-content> </mat-card-content>
    </mat-card>
  </div>
</section>
